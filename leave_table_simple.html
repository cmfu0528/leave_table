<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同仁請假行事曆 (精簡版)</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --tw-bg: #eff6ff;
      --tw-border: #3b82f6;
      --tw-text: #1e40af;
      --abroad-bg: #fff7ed;
      --abroad-border: #f97316;
      --abroad-text: #9a3412;
      --weekend: #dc2626;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      padding: 18px 24px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15);
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 2px;
    }

    .container {
      max-width: 1440px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .controls-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .control-item label.ctrl-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    select, input[type="date"] {
      padding: 8px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      background-color: #fff;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    select:focus, input[type="date"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
    }

    /* Multi-select Member Dropdown */
    .multiselect {
      position: relative;
      min-width: 210px;
    }

    .multiselect-btn {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
    }

    .multiselect-btn:hover {
      border-color: #94a3b8;
    }

    .multiselect-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 280px;
      background: #ffffff;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.15);
      z-index: 150;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .multiselect-menu.open {
      display: flex;
    }

    .ms-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }

    .ms-link {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .ms-link:hover {
      text-decoration: underline;
    }

    .ms-search {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 0.84rem;
      outline: none;
    }

    .ms-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ms-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.86rem;
      cursor: pointer;
      user-select: none;
    }

    .ms-option:hover {
      background: #f1f5f9;
    }

    .ms-option input {
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn {
      padding: 8px 14px;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: var(--text);
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .current-period-banner {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
    }

    .loc-tw {
      background: var(--tw-bg);
      color: var(--tw-text);
      border-left: 3px solid var(--tw-border);
    }

    .loc-abroad {
      background: var(--abroad-bg);
      color: var(--abroad-text);
      border-left: 3px solid var(--abroad-border);
    }

    /* Calendar Grid */
    .calendar-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .weekday-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    .weekday-cell {
      padding: 10px 8px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .weekday-cell.weekend {
      color: var(--weekend);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      background: var(--border);
      gap: 1px;
    }

    .day-cell {
      background: var(--surface);
      min-height: 135px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: background 0.12s;
    }

    .day-cell:hover {
      background: #f8fafc;
    }

    .day-cell.other-month {
      background: #f8fafc;
      opacity: 0.55;
    }

    .day-cell.today {
      background: #eff6ff;
    }

    .day-cell.selected-day {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
      z-index: 2;
    }

    .day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .day-number {
      font-size: 0.92rem;
      font-weight: 800;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .day-cell.weekend .day-number {
      color: var(--weekend);
    }

    .day-cell.today .day-number {
      background: var(--primary);
      color: #ffffff;
    }

    .day-count-badge {
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary);
      padding: 1px 8px;
      border-radius: 999px;
    }

    .day-records {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      max-height: 210px;
    }

    .leave-item {
      border-radius: 5px;
      padding: 4px 7px;
      font-size: 0.76rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-weight: 700;
    }

    .leave-item-left {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leave-item-loc {
      font-size: 0.68rem;
      padding: 0 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.7);
      font-weight: 700;
    }

    .leave-item-time {
      font-size: 0.7rem;
      font-weight: 600;
      flex-shrink: 0;
      opacity: 0.9;
    }

    /* Detail Section */
    .detail-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .detail-section-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .records-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    .records-table th,
    .records-table td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .records-table th {
      background: #f8fafc;
      font-weight: 700;
      color: var(--text-muted);
    }

    .records-table tr:hover {
      background: #f8fafc;
    }

    .name-pill {
      font-weight: 700;
      color: var(--text);
    }

    .loc-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .loc-badge.tw {
      background: var(--tw-bg);
      color: var(--tw-text);
      border: 1px solid #bfdbfe;
    }

    .loc-badge.abroad {
      background: var(--abroad-bg);
      color: var(--abroad-text);
      border: 1px solid #fed7aa;
    }

    .empty-msg {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .weekday-header {
        display: none;
      }
      .calendar-grid {
        grid-template-columns: 1fr;
      }
      .day-cell.other-month {
        display: none;
      }
      .day-cell {
        min-height: auto;
      }
    }
  </style>
</head>

  <header>
    <div class="header-inner">
      <div class="brand">

  <div class="container">

            <option value="week">當周</option>
            <option value="month">整月月曆</option>

        </div>

        <div class="control-item">

        <div class="control-item">

          <button type="button" class="btn" id="btnToday">今天</button>

      </div>

      <div class="controls-group">

        <button type="button" class="btn" id="btnNext">下一個 ▶</button>

    </div>

    <div class="legend-bar">

    <div class="calendar-box" id="calendarBox">
      <div class="weekday-header">

        <div class="weekday-cell">週一 (Mon)</div>
        <div class="weekday-cell">週二 (Tue)</div>
        <div class="weekday-cell">週三 (Wed)</div>
        <div class="weekday-cell">週四 (Thu)</div>
        <div class="weekday-cell">週五 (Fri)</div>
        <div class="weekday-cell weekend">週六 (Sat)</div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="detail-section" id="detailSection">
      <div class="detail-section-title">
        <span id="detailTitle">請假同仁資料</span>
        <span style="font-size:0.85rem;color:var(--text-muted);font-weight:600;" id="detailCount"></span>
      </div>
      <div style="overflow-x:auto;">
        <table class="records-table">
          <thead>
            <tr>
              <th style="width:25%;">請假同仁</th>
              <th style="width:50%;">請假時間</th>
              <th style="width:25%;">區域 (台灣/國外)</th>
            </tr>
          </thead>
          <tbody id="detailTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

    function toYMD(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseYMD(ymdStr) {
      const [y, m, d] = ymdStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function coversDate(rec, dateStr) {
      if (!rec.startDate || !rec.endDate) return false;
      if (dateStr < rec.startDate || dateStr > rec.endDate) return false;
      if (rec.startDate !== rec.endDate) {
        const dow = parseYMD(dateStr).getDay();
        if ((dow === 0 || dow === 6) && dateStr !== rec.startDate && dateStr !== rec.endDate) {
          return false;
        }
      }
      return true;
    }

    function getDayTimeShort(rec, dateStr) {
      const isStart = rec.startDate === dateStr;
      const isEnd = rec.endDate === dateStr;
      if (isStart && isEnd) {
        if (rec.startTime === '08:00' && rec.endTime === '17:00') return '全天';
        return `${rec.startTime}~${rec.endTime}`;
      }
      if (isStart) return `${rec.startTime}起`;
      if (isEnd) return `迄${rec.endTime}`;
      return '全天';
    }

    const ALL_MEMBERS = Array.from(new Set(LEAVE_RECORDS.map(r => r.fullName))).sort();

    const availableMonths = new Set();
    const yearsSet = new Set();
    LEAVE_RECORDS.forEach(r => {
      if (r.startDate) yearsSet.add(Number(r.startDate.slice(0, 4)));
      if (r.endDate) yearsSet.add(Number(r.endDate.slice(0, 4)));
    });
    const mainYear = yearsSet.has(2026) ? 2026 : (Array.from(yearsSet)[0] || new Date().getFullYear());
    for (let m = 1; m <= 12; m++) {
      availableMonths.add(`${mainYear}-${String(m).padStart(2, '0')}`);
    }
    LEAVE_RECORDS.forEach(r => {
      if (r.startDate) availableMonths.add(r.startDate.slice(0, 7));
      if (r.endDate) availableMonths.add(r.endDate.slice(0, 7));
    });
    const sortedMonths = Array.from(availableMonths).sort();

    const now = new Date();
    const todayStr = toYMD(now);
    const defaultDateStr = sortedMonths.includes(todayStr.slice(0, 7))
      ? todayStr
      : `${mainYear}-01-01`;

    const state = {

      focusDate: defaultDateStr,
      selectedMembers: new Set(ALL_MEMBERS),
      memberSearch: ''

    const monthSelectEl = document.getElementById('monthSelect');

    function initControls() {
      monthSelectEl.innerHTML = '';
      sortedMonths.forEach(ym => {
        const [y, m] = ym.split('-');
        const opt = document.createElement('option');
        opt.value = ym;
        opt.textContent = `${y} 年 ${Number(m)} 月`;
        monthSelectEl.appendChild(opt);
      });

      renderMemberOptions();
      updateMultiselectButtonLabel();
      syncInputsWithState();
    }

    function renderMemberOptions() {
      msOptionsList.innerHTML = '';
      const q = state.memberSearch.trim().toLowerCase();
      ALL_MEMBERS.forEach(fullName => {
        if (q && !fullName.toLowerCase().includes(q)) return;
        const label = document.createElement('label');
        label.className = 'ms-option';
        const checked = state.selectedMembers.has(fullName) ? 'checked' : '';
        label.innerHTML = `
          <input type="checkbox" value="${fullName}" ${checked}>
          <span>${fullName}</span>
        `;
        label.querySelector('input').addEventListener('change', (e) => {
          if (e.target.checked) {
            state.selectedMembers.add(fullName);
          } else {
            state.selectedMembers.delete(fullName);
          }
          updateMultiselectButtonLabel();
          render();
        });
        msOptionsList.appendChild(label);
      });
    }

    function updateMultiselectButtonLabel() {
      const count = state.selectedMembers.size;
      if (count === ALL_MEMBERS.length) {
        msBtnLabel.textContent = `全部同仁 (${ALL_MEMBERS.length})`;
      } else if (count === 0) {
        msBtnLabel.textContent = '未選擇同仁 (0)';
      } else if (count <= 2) {
        const names = Array.from(state.selectedMembers).map(n => n.split('(')[0]);
        msBtnLabel.textContent = names.join('、');
      } else {
        msBtnLabel.textContent = `已選 ${count} 位同仁`;
      }
    }

    function syncInputsWithState() {
      const ym = state.focusDate.slice(0, 7);
      if (Array.from(monthSelectEl.options).some(o => o.value === ym)) {
        monthSelectEl.value = ym;
      }
      modeSelectEl.value = state.mode;
      focusDateInputEl.value = state.focusDate;
    }

    function getFilteredRecords() {
      return LEAVE_RECORDS.filter(r => state.selectedMembers.has(r.fullName));
    }

    function getWeekRange(dateStr) {
      const d = parseYMD(dateStr);
      const dow = d.getDay();
      const start = new Date(d);
      start.setDate(d.getDate() - dow);
      const days = [];
      for (let i = 0; i < 7; i++) {
        const cur = new Date(start);
        cur.setDate(start.getDate() + i);
        days.push(toYMD(cur));
      }
      return days;
    }

    function render() {
      syncInputsWithState();
      const filtered = getFilteredRecords();
      const focusObj = parseYMD(state.focusDate);
      const year = focusObj.getFullYear();
      const month = focusObj.getMonth() + 1;

      if (state.mode === 'month') {
        currentPeriodLabelEl.textContent = `${year} 年 ${month} 月`;
        calendarBoxEl.classList.remove('hidden');
        renderMonthGrid(year, month, filtered);
        renderDetailTableForDates([state.focusDate], `${state.focusDate} 當日請假同仁資料`, filtered);
      } else if (state.mode === 'week') {
        const weekDays = getWeekRange(state.focusDate);
        currentPeriodLabelEl.textContent = `當周：${weekDays[0]} ～ ${weekDays[6]}`;
        calendarBoxEl.classList.remove('hidden');
        renderWeekGrid(weekDays, filtered);
        renderDetailTableForDates(weekDays, `當周請假同仁資料 (${weekDays[0]} ～ ${weekDays[6]})`, filtered);
      } else if (state.mode === 'day') {
        const weekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
        const wName = weekdays[focusObj.getDay()];
        currentPeriodLabelEl.textContent = `當日：${state.focusDate} (${wName})`;
        calendarBoxEl.classList.add('hidden');
        renderDetailTableForDates([state.focusDate], `${state.focusDate} (${wName}) 當日請假同仁資料`, filtered);
      }
    }

    function renderMonthGrid(year, month, filtered) {
      calendarGridEl.innerHTML = '';
      const firstDay = new Date(year, month - 1, 1);
      const startDow = firstDay.getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      const prevMonthDays = new Date(year, month - 1, 0).getDate();

      for (let i = startDow - 1; i >= 0; i--) {
        const d = prevMonthDays - i;
        const pm = month === 1 ? 12 : month - 1;
        const py = month === 1 ? year - 1 : year;
        const dStr = `${py}-${String(pm).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        calendarGridEl.appendChild(buildDayCell(dStr, d, true, filtered));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        calendarGridEl.appendChild(buildDayCell(dStr, d, false, filtered));

      const total = startDow + daysInMonth;
      const trailing = (7 - (total % 7)) % 7;
      for (let d = 1; d <= trailing; d++) {
        const nm = month === 12 ? 1 : month + 1;
        const ny = month === 12 ? year + 1 : year;
        const dStr = `${ny}-${String(nm).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        calendarGridEl.appendChild(buildDayCell(dStr, d, true, filtered));
      }
    }

    function renderWeekGrid(weekDays, filtered) {
      calendarGridEl.innerHTML = '';
      weekDays.forEach(dStr => {
        const dayNum = Number(dStr.slice(8, 10));
        const monthNum = Number(dStr.slice(5, 7));
        calendarGridEl.appendChild(buildDayCell(dStr, `${monthNum}/${dayNum}`, false, filtered));
      });
    }

    function buildDayCell(dateStr, labelText, isOtherMonth, filtered) {
      const cell = document.createElement('div');
      const dow = parseYMD(dateStr).getDay();
      const isWeekend = dow === 0 || dow === 6;

      cell.className = 'day-cell' +
        (isOtherMonth ? ' other-month' : '') +
        (isWeekend ? ' weekend' : '') +
        (dateStr === todayStr ? ' today' : '') +
        (dateStr === state.focusDate ? ' selected-day' : '');

      const dayRecs = filtered.filter(r => coversDate(r, dateStr));
      const uniquePeople = new Set(dayRecs.map(r => r.fullName)).size;

      const top = document.createElement('div');
      top.className = 'day-top';
      top.innerHTML = `
        <span class="day-number" style="${String(labelText).includes('/') ? 'width:auto;padding:0 6px;border-radius:6px;' : ''}">${labelText}</span>
        ${uniquePeople > 0 ? `<span class="day-count-badge">${uniquePeople} 人</span>` : ''}
      `;
      cell.appendChild(top);

      const list = document.createElement('div');
      list.className = 'day-records';

      dayRecs.forEach(r => {
        const item = document.createElement('div');
        const isAbroad = r.location === '國外';
        item.className = 'leave-item ' + (isAbroad ? 'loc-abroad' : 'loc-tw');
        const shortTime = getDayTimeShort(r, dateStr);
        item.title = `請假同仁：${r.name}\n請假時間：${r.period}\n區域：${r.location}`;
        item.innerHTML = `
          <div class="leave-item-left">
            <span>${r.name}</span>
            <span class="leave-item-loc">${r.location}</span>
          </div>
          <span class="leave-item-time">${shortTime}</span>
        `;
        list.appendChild(item);
      });

      cell.appendChild(list);

      cell.addEventListener('click', () => {
        state.focusDate = dateStr;
        render();
        document.getElementById('detailSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });

      return cell;
    }

    function renderDetailTableForDates(dateList, titleText, filtered) {
      detailTitleEl.textContent = titleText;
      detailTableBodyEl.innerHTML = '';

      const seen = new Set();
      const rowsToRender = [];
      dateList.forEach(dStr => {
        const hits = filtered.filter(r => coversDate(r, dStr));
        hits.forEach(r => {
          const key = `${r.fullName}|${r.period}|${r.location}`;
          if (!seen.has(key)) {
            seen.add(key);
            rowsToRender.push(r);
          }
        });
      });

      const uniquePeople = new Set(rowsToRender.map(r => r.fullName)).size;
      detailCountEl.textContent = `共 ${uniquePeople} 位同仁 / ${rowsToRender.length} 筆紀錄`;

      if (rowsToRender.length === 0) {
        detailTableBodyEl.innerHTML = `
          <tr>
            <td colspan="3" class="empty-msg">所選期間無符合條件的請假同仁資料</td>
          </tr>
        `;
        return;
      }

      rowsToRender.forEach(rec => {
        const tr = document.createElement('tr');
        const isAbroad = rec.location === '國外';
        tr.innerHTML = `
          <td><span class="name-pill">${rec.name}</span></td>
          <td>${rec.period}</td>
          <td><span class="loc-badge ${isAbroad ? 'abroad' : 'tw'}">${isAbroad ? '✈️ 國外' : '🏠 台灣'}</span></td>
        `;
        detailTableBodyEl.appendChild(tr);
      });
    }

    monthSelectEl.addEventListener('change', (e) => {
      state.focusDate = `${e.target.value}-01`;
      render();
    });

    modeSelectEl.addEventListener('change', (e) => {
      state.mode = e.target.value;
      render();
    });

    focusDateInputEl.addEventListener('change', (e) => {
      if (e.target.value) {
        state.focusDate = e.target.value;
        render();
      }
    });

    document.getElementById('btnToday').addEventListener('click', () => {
      state.focusDate = todayStr;
      render();
    });

    msToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      msMenu.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!document.getElementById('memberMultiselect').contains(e.target)) {
        msMenu.classList.remove('open');
      }
    });

    document.getElementById('msSelectAll').addEventListener('click', () => {
      state.selectedMembers = new Set(ALL_MEMBERS);
      renderMemberOptions();
      updateMultiselectButtonLabel();
      render();
    });

    document.getElementById('msClearAll').addEventListener('click', () => {
      state.selectedMembers.clear();
      renderMemberOptions();
      updateMultiselectButtonLabel();
      render();
    });

    msSearchInput.addEventListener('input', (e) => {
      state.memberSearch = e.target.value;
      renderMemberOptions();
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
      const d = parseYMD(state.focusDate);
      if (state.mode === 'month') {
        d.setMonth(d.getMonth() - 1);
        d.setDate(1);
      } else if (state.mode === 'week') {
        d.setDate(d.getDate() - 7);
      } else {
        d.setDate(d.getDate() - 1);
      }
      state.focusDate = toYMD(d);
      render();
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      const d = parseYMD(state.focusDate);
      if (state.mode === 'month') {
        d.setMonth(d.getMonth() + 1);
        d.setDate(1);
      } else if (state.mode === 'week') {
        d.setDate(d.getDate() + 7);
      } else {
        d.setDate(d.getDate() + 1);
      }
      state.focusDate = toYMD(d);
      render();
    });

    initControls();
    render();
  </script>
</body>
</html>
